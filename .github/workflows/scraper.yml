name: Sarkari Job Scraper

on:
  schedule:
    # Runs every 12 hours — 6:00 AM & 6:00 PM UTC (11:30 AM & 11:30 PM IST)
    - cron: '0 6,18 * * *'
  workflow_dispatch:   # Manual trigger from GitHub UI (Actions tab → Run workflow)

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      # ── All secrets are read from GitHub Repository Secrets ──────────────
      # Go to: Settings → Secrets and variables → Actions → New repository secret
      #   GEMINI_API_KEY       — Google AI Studio  → https://aistudio.google.com/apikey
      #   SERPER_API_KEY       — Serper Dev         → https://serper.dev/api-key
      #   SCRAPER_API_KEY      — The same key you set in Lovable Cloud Secrets
      #   SUPABASE_PROJECT_ID  — ivwctxktrtbvpuwbmtyv
      - name: Run Sarkari Job Scraper
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY:      ${{ secrets.SERPER_API_KEY }}
          SCRAPER_API_KEY:     ${{ secrets.SCRAPER_API_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: python scraper/main.py

      - name: Upload scraper log as artifact
        if: always()   # Upload logs even if the scraper step fails
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper/logs/
          retention-days: 7
